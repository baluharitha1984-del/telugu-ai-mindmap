name: Build Google Play Store App

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Install Project Dependencies
    run: npm install

  - name: Build Web App
    run: npm run build

  - name: Install Capacitor
    run: npm install @capacitor/core @capacitor/cli @capacitor/android

  - name: Create Capacitor Config
    run: |
      echo '{"appId":"com.telugu.app","appName":"TeluguAI","webDir":"dist"}' > capacitor.config.json

  - name: Create Android Wrapper
    run: |
      npx cap add android || true
      npx cap sync android

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 17

  - name: Build APK
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: play-ready-debug-apk
      path: android/app/build/outputs/apk/debug/*.apk
